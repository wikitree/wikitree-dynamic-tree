<!DOCTYPE html>
<html lang="en">

<head>
  <title>Tree Apps</title>

  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta charset="utf-8" />
  <link rel="shortcut icon" href="https://www.wikitree.com/favicon.ico" />
  <meta property="og:image" content="https://www.wikitree.com/images/og-image.png" />
  <meta property="og:type" content="website" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://www.wikitree.com/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://www.wikitree.com/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://www.wikitree.com/favicon-16x16.png">
  <link rel="mask-icon" href="https://www.wikitree.com/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="viewport" content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://www.wikitree.com/skins/common/wikibits.js"></script>
  <script src="https://www.wikitree.com/skins/common/ajax.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-vars.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-fonts.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-opensans.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-examples.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-forms.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-buttons.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-links.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-icons.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-navigation.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-header.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-footer.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-components.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-content.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-tree.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-avatars.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-privacy.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-comments.css" />
  <link rel="stylesheet" href="https://www.wikitree.com/css/wt-stylesheet.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <script src="WikiTreeAPI.js"></script>
  <script src="tree.js"></script>
  <script src="person_name.js"></script>
  <script src="views/shared/DateFormatOptions.js"></script>
  <link rel="stylesheet" href="tree.css" />

  <!-- jquery-ui.min.js is used by many apps, but only for its draggable function. It was created at
      https://jqueryui.com/download/ to only contain draggable and its dependencies. -->
  <script src="views/shared/jquery-ui.min.js"></script>

  <!-- The Tree Apps themselves are not included here. Each app's scripts and stylesheets are listed in index.js
      and are only loaded when the app is selected. -->
</head>

<body>
  <script>
    // A var statement creates a global variable. This is here because of modules (an inelegent solution, I know
    // - the globals, not modules).
    var debugLoggingOn = false; // set to true to turn on debug logging to the console
  </script>
  <!-- The View Registry, for adding new views, is in index.js. -->
  <script src="index.js"></script>

  <header>
    <div class="container full-width d-none d-lg-block">
      <div class="row align-items-center">
        <div class="col-3">
          <a class="visually-hidden-focusable" href="#main">Skip to main content</a>
          <a href="/">
            <img src="https://www.wikitree.com/images/wikitree-logo-tagline.png"
              alt="WikiTree: Where genealogists collaborate">
          </a>
        </div>
        <div class="col-6 d-flex justify-content-center">
        </div>
        <div class="col-3 d-flex justify-content-end">
        </div>
      </div>
    </div>
  </header>

  <div class="tabs--wrapper has--current">
    <div class="container">
      <div class="row">
        <div class="col" id="tabs">
          <nav>
            <div class="profile--actions float-end">
              <div id="wt-api-login"></div>
            </div>
            <div id="settings-panel">
              <form>
                <label for="view-select">TREE APP:</label>
                <select id="view-select"></select>
                <label for="wt-id-text">ID:</label>
                <input id="wt-id-text" type="text" placeholder="e.g. Windsor-1" />
                <input id="show-btn" class="btn btn-primary p-2" type="submit" value="GO" />
              </form>
            </div>
            
          </nav>
        </div>
      </div>
    </div>
  </div>

  <main id="main" data-bs-root-margin="0px 0px -60%" data-bs-smooth-scroll="true">
    <div class="row mt-3">
      <div class="col-lg-12">
        <main>
          <div id="view-loader" class="hidden">Loading...</div>
          <div id="wt-status" class="status hidden"></div>
          <div id="info-panel" class="hidden">
            <h2>
              <span id="view-title"></span> for <span id="name-placeholder"></span> -
              <a id="wt-id-link" target="_blank"></a>
            </h2>
            <p id="view-description"></p>
          </div>
        </main>
        <div id="view-container"></div>
      </div>
    </div>
  </main>
</body>

</html>
